name: CI

# the workflows only read the repository and talk to the database and storage with their own secrets
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://x:x@localhost:5432/x
          DIRECT_URL: postgresql://x:x@localhost:5432/x
      - run: npm run typecheck
      - run: npx next build
        env:
          DATABASE_URL: postgresql://x:x@localhost:5432/x
          DIRECT_URL: postgresql://x:x@localhost:5432/x
      - run: npm test
