# Deploys the site to our own server: asks Coolify to pull this branch, build the image and swap it in (the old one keeps
# running until the new one is up; a failed build changes nothing). Pushes that only touch workflows, scripts, tests or notes
# do not deploy.
name: Deploy
on:
  push:
    branches: [main]
    paths:
      - 'src/app'
      - 'src/components'
      - 'src/lib'
      - 'src/middleware.ts'
      - 'public/eed8d83efac81fa695d6faa0fcaf5ada.txt'
      - 'public/maskable-icon.png'
      - 'prisma/schema.prisma'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.mjs'
      - 'tailwind.config.ts'
      - 'postcss.config.mjs'
      - 'tsconfig.json'
      - 'Dockerfile'
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Ask Coolify to deploy
        run: |
          curl --fail --show-error --silent --max-time 60 -X POST             -H "Authorization: Bearer ${{ secrets.COOLIFY_DEPLOY_TOKEN }}"             "https://deploy.ckfportugal.com/api/v1/deploy?uuid=rwzwljn9bye51sea4a6j6xuv&force=false"
